name: Pipeline de Testes Automáticos

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Find and Build with Maven
      run: |
        POM_PATH=$(find . -name "pom.xml" -not -path "*/.*" | head -n 1)
        echo "Encontrado pom.xml em: $POM_PATH"
        mvn clean test -f "$POM_PATH"
